name: AI workflow merge status
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  issues: write
jobs:
  status:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this write-permission job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/automation/github.mjs sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
