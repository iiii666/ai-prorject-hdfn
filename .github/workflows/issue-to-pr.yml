name: Issue to AI PR
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open ai-ready Issue number
        required: true
        type: string
permissions: {}
concurrency:
  group: ai-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'ai-ready')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      run: ${{ steps.task.outputs.run }}
      issue: ${{ steps.task.outputs.issue }}
      base: ${{ steps.task.outputs.base }}
      branch: ${{ steps.task.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: task
        run: node scripts/automation/github.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}
      - uses: actions/upload-artifact@v4
        if: steps.task.outputs.run == 'true'
        with:
          name: agent-task
          path: .agent-context/issue.json
          include-hidden-files: true
          retention-days: 30
  design:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      TASK_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: .agent-context
      - name: Prepare design sandbox
        run: |
          if ! command -v setfacl >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y acl; fi
          mkdir -p "$RUNNER_TEMP/agent-patches" "$RUNNER_TEMP/controller" "$RUNNER_TEMP/codex-home"
          printf 'approval_policy = "never"\n[sandbox_workspace_write]\nnetwork_access = true\n' > "$RUNNER_TEMP/codex-home/config.toml"
          cp scripts/automation/policy.mjs scripts/automation/patch.mjs "$RUNNER_TEMP/controller/"
          printf '\n.agent-context/\nwork/\n' >> .git/info/exclude
          git switch -c "$TASK_BRANCH"
      - name: Codex design phase
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/spec.md
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: .agent-context/spec-result.md
      - name: Freeze and validate design BEFORE implementation
        run: |
          git -c core.hooksPath=/dev/null add -A
          git diff --cached --binary "$BASE_SHA" > "$RUNNER_TEMP/agent-patches/spec.patch"
          git reset --mixed "$BASE_SHA"
          git restore --worktree .
          git clean -fd -- docs/changes
          node "$RUNNER_TEMP/controller/patch.mjs" spec "$RUNNER_TEMP/agent-patches/spec.patch" "$ISSUE_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-design
          path: ${{ runner.temp }}/agent-patches/spec.patch
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-design-report
          path: .agent-context/spec-result.md
          include-hidden-files: true
          retention-days: 30
  agent:
    needs: [prepare, design]
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dw_app
          POSTGRES_PASSWORD: dw_local_password
          POSTGRES_DB: hyundai_dw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw_app -d hyundai_dw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: dw_app
      DB_PASSWORD: dw_local_password
      DB_DATABASE: hyundai_dw
      DATABASE_URL: ""
      DW_PYTHON: /tmp/dw-browser-venv/bin/python
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      TASK_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: .agent-context
      - name: Prepare isolated tools
        run: |
          if ! command -v setfacl >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y acl; fi
          npm ci
          python3 -m venv /tmp/dw-browser-venv
          /tmp/dw-browser-venv/bin/pip install playwright
          /tmp/dw-browser-venv/bin/playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/agent-patches" "$RUNNER_TEMP/controller" "$RUNNER_TEMP/codex-home"
          printf 'approval_policy = "never"\n[sandbox_workspace_write]\nnetwork_access = true\n' > "$RUNNER_TEMP/codex-home/config.toml"
          cp scripts/automation/policy.mjs scripts/automation/patch.mjs "$RUNNER_TEMP/controller/"
          printf '\n.agent-context/\nwork/\n' >> .git/info/exclude
          git switch -c "$TASK_BRANCH"
      - uses: actions/download-artifact@v4
        with:
          name: agent-design
          path: ${{ runner.temp }}/agent-patches
      - name: Apply approved design
        run: |
          node "$RUNNER_TEMP/controller/patch.mjs" spec "$RUNNER_TEMP/agent-patches/spec.patch" "$ISSUE_NUMBER"
          git rev-parse HEAD > "$RUNNER_TEMP/spec-head"
      - name: Codex implementation and self-tests
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/implement.md
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: .agent-context/implementation-result.md
      - name: Capture implementation patch
        run: |
          git -c core.hooksPath=/dev/null add -A
          git diff --cached --binary "$(cat "$RUNNER_TEMP/spec-head")" > "$RUNNER_TEMP/agent-patches/implementation.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-patches
          path: ${{ runner.temp }}/agent-patches/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-self-report
          path: .agent-context/*-result.md
          include-hidden-files: true
          retention-days: 30
  verify:
    needs: [prepare, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      policy_ok: ${{ steps.apply.outcome == 'success' }}
      tree: ${{ steps.apply.outputs.tree }}
      passed: ${{ steps.checks.outcome == 'success' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dw_app
          POSTGRES_PASSWORD: dw_local_password
          POSTGRES_DB: hyundai_dw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw_app -d hyundai_dw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: dw_app
      DB_PASSWORD: dw_local_password
      DB_DATABASE: hyundai_dw
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      DW_PYTHON: /tmp/dw-browser-venv/bin/python
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: agent-patches
          path: .agent-patches
      - name: Prepare trusted dependencies
        run: |
          npm ci
          python3 -m venv /tmp/dw-browser-venv
          /tmp/dw-browser-venv/bin/pip install playwright
          /tmp/dw-browser-venv/bin/playwright install --with-deps chromium
      - id: apply
        name: Validate paths, spec-first ordering and final tree
        continue-on-error: true
        run: |
          node scripts/automation/patch.mjs spec .agent-patches/spec.patch "$ISSUE_NUMBER"
          node scripts/automation/patch.mjs implementation .agent-patches/implementation.patch "$ISSUE_NUMBER"
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"
      - id: checks
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: node scripts/automation/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-verification
          path: work/agent-verification/
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce verification result
        if: steps.apply.outcome != 'success' || steps.checks.outcome != 'success'
        run: exit 1
  publish:
    needs: [prepare, agent, verify]
    if: always() && needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    env:
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
      POLICY_OK: ${{ needs.verify.outputs.policy_ok }}
      VERIFIED: ${{ needs.verify.outputs.passed }}
      TESTED_TREE: ${{ needs.verify.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: .agent-context
      - uses: actions/download-artifact@v4
        if: env.POLICY_OK == 'true'
        with:
          name: agent-patches
          path: .agent-patches
      - uses: actions/download-artifact@v4
        if: env.POLICY_OK == 'true'
        continue-on-error: true
        with:
          name: agent-verification
          path: work/agent-verification
      - name: Publish exact verified tree and CI evidence
        run: node scripts/automation/github.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
