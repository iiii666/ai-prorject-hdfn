name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dw_app
          POSTGRES_PASSWORD: dw_local_password
          POSTGRES_DB: hyundai_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dw_app -d hyundai_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: dw_app
      DB_PASSWORD: dw_local_password
      DB_DATABASE: hyundai_dw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:pg
      - name: Install browser test dependencies
        run: |
          python3 -m venv /tmp/dw-browser-venv
          /tmp/dw-browser-venv/bin/pip install playwright
          /tmp/dw-browser-venv/bin/playwright install --with-deps chromium
      - name: Browser investigation and history
        run: |
          mkdir -p work
          npm start > work/browser-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          /tmp/dw-browser-venv/bin/python tests/investigation_browser_smoke.py
          /tmp/dw-browser-venv/bin/python tests/history_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-browser-results
          path: work/
          if-no-files-found: ignore
