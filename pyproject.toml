[project]
name = "hyundai-dw-backend"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "asyncmy>=0.2.10,<0.3", "openai>=2,<3", "python-dotenv>=1,<2", "jsonschema>=4,<5"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
